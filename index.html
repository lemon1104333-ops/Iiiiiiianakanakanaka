<style>
:root{--bg:#0b0b10;--fg:#f4f0f0;--ac:#ff4d79;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans",sans-serif;overflow:hidden;touch-action:manipulation}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;z-index:50}
button{font:inherit;color:var(--fg);background:#2b2433;border:1px solid #6a5a7a;border-radius:12px;padding:10px 14px;margin:3px}
#title{display:flex;background:radial-gradient(#3a0f1f,#050507)}
#title h1{font-size:9vw;margin:0;color:var(--ac);text-shadow:0 0 18px #f03}
#dlg{position:fixed;left:8px;right:8px;bottom:84px;background:#000c;border:1px solid #fff4;border-radius:14px;padding:12px;display:none;z-index:20;font-size:16px;line-height:1.6}
#nm{color:var(--ac);font-weight:700;font-size:14px}#ch button{display:block;width:100%;text-align:left;background:#3b2040}
#ctl{position:fixed;left:10px;bottom:10px;display:none;z-index:15;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:2px;touch-action:none;user-select:none;-webkit-user-select:none}#ctl button{width:60px;height:60px;margin:0;padding:0;font-size:24px;border-radius:14px;opacity:.8;touch-action:none}
#pi{position:fixed;right:10px;bottom:10px;width:64px;height:64px;font-size:30px;border-radius:16px;z-index:25;display:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;text-align:center;font-size:13px;opacity:.95;z-index:35;pointer-events:none;text-shadow:0 0 6px #000}
#toast{position:fixed;top:14%;left:50%;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:20px;z-index:60;display:none;font-size:14px;max-width:90%;text-align:center}
.card{position:fixed;top:7vh;left:50%;transform:translateX(-50%);width:min(86vw,320px);background:#15131a;border:2px solid #777;border-radius:22px;padding:14px;z-index:30;display:none;text-align:center}
#ph{height:70vh;overflow:auto}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.apps button{font-size:30px;padding:10px 0}.apps small{display:block;font-size:11px}
pre{white-space:pre-wrap;text-align:left;font:inherit;font-size:14px}
#cam{position:fixed;inset:0;display:none;z-index:28;border:20px solid #000;pointer-events:none}#cam button{pointer-events:auto;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:30px;border-radius:50%;width:72px;height:72px}
#cam b{position:absolute;top:8px;left:8px;color:#f33;font-size:14px}
#lyr{position:fixed;top:22%;left:0;right:0;text-align:center;font-size:17px;z-index:19;text-shadow:0 0 8px #000;display:none;padding:0 12px}
#end{background:#000e;z-index:70}#end h1{font-size:9vw;margin:0}
#hz{background:#300;z-index:65;color:#f22;font-size:7vw;font-weight:900;text-shadow:0 0 12px #000;animation:g .12s infinite}
@keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-4px,3px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,-4px)}}
#red{position:fixed;inset:0;background:#a00;opacity:0;pointer-events:none;z-index:40}
#hm{display:block;width:46px;height:46px;margin:6px auto;padding:0;border-radius:50%;background:#111;border:3px solid #bbb;animation:hp 1.2s infinite}#hm::after{content:"";display:block;width:16px;height:16px;border:2px solid #bbb;border-radius:4px;margin:auto}
@keyframes hp{0%,100%{box-shadow:0 0 0 0 #fff0}50%{box-shadow:0 0 0 7px #fff5,0 0 14px #fff8}}
.mz{background:radial-gradient(circle at 50% 50%,#600 0,#100 60%,#000 100%)!important;border:2px solid #c00;box-shadow:0 0 12px #f00a,inset 0 0 10px #000!important;animation:mj .9s infinite;transform:rotate(-4deg)}
.mz span{filter:drop-shadow(0 0 4px #f00)}
@keyframes mj{0%,100%{transform:rotate(-4deg) translate(0,0)}20%{transform:rotate(3deg) translate(2px,-1px);filter:hue-rotate(0)}40%{transform:rotate(-6deg) translate(-2px,1px)}60%{transform:rotate(2deg) translate(1px,2px);filter:brightness(1.8)}80%{transform:rotate(-3deg) translate(-1px,-2px)}}
.ap small.mzs{color:#e22;letter-spacing:2px;text-shadow:0 0 6px #f00}
#ph,#ip{padding:0!important;overflow:hidden;background:#000;border:6px solid #2a2a30;border-radius:42px;box-shadow:0 0 0 2px #666,0 20px 50px #000a;text-align:left}
#ph{top:3vh;width:min(88vw,330px);height:min(86vh,680px)}#ip{top:3vh;width:min(70vw,250px);height:min(56vh,430px)}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;font-size:13px}.sb{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:12px;position:relative}.di{width:70px;height:20px;background:#000;border-radius:12px;position:absolute;left:50%;top:8px;transform:translateX(-50%)}
.ap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:30px 14px;text-align:center}.ap u{display:flex;width:54px;height:54px;border-radius:13px;margin:0 auto 4px;align-items:center;justify-content:center;font-size:22px;font-weight:800;text-decoration:none;box-shadow:0 2px 6px #0006}.ap small{font-size:11px}.dk{margin-top:auto;padding:12px;text-align:center}
.ah{padding:6px 14px 8px;font-size:17px;font-weight:700}.ab{flex:1;overflow:auto;padding:0 12px}.hb{height:26px;display:flex;justify-content:center;align-items:center}.hb::after{content:"";width:110px;height:5px;border-radius:3px;background:#fffc}
.bb{padding:8px 12px;border-radius:16px;margin:6px 0;max-width:78%;color:#000;background:#fff}.br{margin-left:auto;background:#06c755;color:#fff}.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 24px}.kp button{height:48px;border-radius:50%;font-size:22px;margin:0}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.gd i{aspect-ratio:1;background:linear-gradient(135deg,#555,#222)}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45}
#cam .fr{position:absolute;left:50%;top:44%;width:58%;height:46%;transform:translate(-50%,-50%);border:2px solid #fff9;border-radius:8px}
#zm{position:absolute;top:8px;right:8px;font:12px monospace;color:#fff;text-shadow:0 0 4px #000}
#cam #cx{left:14px;bottom:34px;transform:none;width:46px;height:46px;font-size:18px}
